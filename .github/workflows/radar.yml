name: Radar de Leads IG

on:
  schedule:
    - cron: "0 5 * * *"   # todo dia as 05:00 UTC (~02:00 horario de Brasilia)
  workflow_dispatch: {}

jobs:
  raspar-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar radar de leads
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: python radar_leads.py

      - name: Disponibilizar planilha de leads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-instagram-${{ github.run_number }}-${{ github.run_attempt }}
          path: leads.csv
          retention-days: 30
          if-no-files-found: error
