# teste solicitado apos atualizar IG_PASSWORD em 2026-09-02
name: Radar de Leads IG

on:
  push:
    branches: [main]
    paths:
      - "radar_leads.py"
      - "requirements.txt"
      - ".github/workflows/radar.yml"
  schedule:
    - cron: "0 5 * * *"   # todo dia as 05:00 UTC (~02:00 horario de Brasilia)
  workflow_dispatch: {}

jobs:
  raspar-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar sessao segura do Instagram
        uses: actions/cache@v5
        with:
          path: .cache
          key: ig-session-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ig-session-

      - name: Rodar radar de leads
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: python radar_leads.py

      - name: Disponibilizar planilha de leads
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: leads-instagram-${{ github.run_number }}-${{ github.run_attempt }}
          path: leads.csv
          retention-days: 30
          if-no-files-found: error
