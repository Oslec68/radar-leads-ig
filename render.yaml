services:
  - type: cron
    name: radar-leads-ig
    env: python
    schedule: "0 5 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python radar_leads.py
    envVars:
      - key: IG_USERNAME
        sync: false
      - key: IG_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GOOGLE_SHEETS_CREDS_JSON
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
